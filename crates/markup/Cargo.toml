[package]
name = "guilab-markup"
description = "egui widgets for drawing on screenshots, queueing them and chatting: screenshot in, annotated images and messages out"
version.workspace = true
edition.workspace = true
license.workspace = true

# Depends only on egui and guilab-kit (theme, shared widgets). No compositor or IPC types.

[lib]
doctest = false

[dependencies]
egui = { version = "0.35", default-features = false, features = ["default_fonts"] }
guilab-kit.workspace = true

[dev-dependencies]
png.workspace = true
