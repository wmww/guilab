[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
guilab-proto = { path = "crates/proto" }
guilab-compositor = { path = "crates/compositor" }
guilab-server = { path = "crates/server" }
# Pinned master: crates.io 0.7 is too old (see notes/code-map.md). Bump deliberately.
smithay = { git = "https://github.com/Smithay/smithay", rev = "9ff2c5a410e91c592e19d6fb126c299308dce119", default-features = false, features = [
    "wayland_frontend", "desktop", "backend_egl", "backend_gbm", "renderer_gl", "renderer_pixman", "xwayland",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustix = { version = "1", features = ["process", "fs", "pipe"] }
png = "0.18"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
calloop = { version = "0.14.5", features = ["signals"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
